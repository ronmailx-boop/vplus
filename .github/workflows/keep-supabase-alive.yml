name: Keep Supabase project alive

on:
  schedule:
    - cron: "0 9 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write Supabase heartbeat
        run: |
          now=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X PATCH "https://ftvmhhbacepwcxigvpdc.supabase.co/rest/v1/keepalive_heartbeat?id=eq.1" \
            -H "apikey: sb_publishable_F2_IjYFUJeKObjw3Tcy2yg_x5WCxwYC" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"pinged_at\": \"$now\"}")
          echo "Supabase heartbeat write responded with HTTP $status"
          if [ "$status" -ge 400 ]; then
            echo "::warning::Supabase heartbeat write returned HTTP $status — check the project isn't paused."
          fi
