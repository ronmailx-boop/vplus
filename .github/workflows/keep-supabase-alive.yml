name: Keep Supabase project alive

on:
  schedule:
    - cron: "0 9 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://ftvmhhbacepwcxigvpdc.supabase.co/rest/v1/shared_lists?select=id&limit=1" \
            -H "apikey: sb_publishable_F2_IjYFUJeKObjw3Tcy2yg_x5WCxwYC")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 400 ]; then
            echo "::warning::Supabase ping returned HTTP $status — check the project isn't paused."
          fi
